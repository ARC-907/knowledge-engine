# Docker Compose definition for a single local knowledge-engine server.
#
#   docker compose up -d --build
#   docker compose exec knowledge-engine knowledge-engine reindex
#   curl http://127.0.0.1:9210/health
#
# The corpus in ./corpus is mounted read-only. Indexes, registry cache, and
# agent-board databases persist in the named volume `ke-data`. See
# 01-user-docs/DEPLOYMENT.md ("Docker") for details.

services:
  knowledge-engine:
    build:
      context: .
      dockerfile: Dockerfile
      # The service runs as this UID/GID inside the container. Set KE_UID/KE_GID
      # to your own ids (KE_UID=$(id -u) KE_GID=$(id -g) docker compose build) if
      # you want the container to write to a bind-mounted ./corpus.
      args:
        KE_UID: "${KE_UID:-10001}"
        KE_GID: "${KE_GID:-10001}"
    image: knowledge-engine:local
    ports:
      # Loopback only. The engine has no built-in authentication; put a
      # reverse proxy with auth/TLS in front before exposing it further.
      - "127.0.0.1:9210:9210"
    volumes:
      # Read-only corpus; it must already contain registry.json (run
      # `knowledge-engine bootstrap` once against a writable mount first).
      # Registry edits through the dashboard/API or `bootstrap` need a writable
      # mount AND a container user that owns ./corpus: drop ":ro" and build
      # with KE_UID/KE_GID matching the owner of ./corpus (see above).
      - ./corpus:/data/corpus:ro
      - ke-data:/data/.knowledge-engine
    environment:
      KE_HOME: /data
      KE_CORPUS_ROOT: /data/corpus
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ke-data:
