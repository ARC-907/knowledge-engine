# Run `uv run pre-commit install` once; hooks then run on every commit.
# Keep hook versions in step with the pins in engine/pyproject.toml.
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=600"]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.(ps1|bat|cmd)$'
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (engine)
        entry: uv run --project engine mypy
        language: system
        pass_filenames: false
        files: ^engine/src/.*\.py$
      - id: uv-lock-check
        name: uv.lock is in sync with pyproject.toml
        entry: uv lock --project engine --check
        language: system
        pass_filenames: false
        files: ^engine/(pyproject\.toml|uv\.lock)$
