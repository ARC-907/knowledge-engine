name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel a release that is already publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.x"
          python-version: "3.12"
      - name: Tag must match the package version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_version=$(uv version --project engine --short)
          if [ "v${pkg_version}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match engine/pyproject.toml version $pkg_version"; exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: uv build --project engine --out-dir dist
      - name: Check metadata
        run: uv run --project engine --group build twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub Release and upload assets
      id-token: write     # OIDC token for Sigstore signing of the provenance attestation
      attestations: write # store the attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          changelog=CHANGELOG.md
          [ -f "$changelog" ] || changelog=02-dev-docs/CHANGELOG.md
          # Everything between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' "$changelog" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION; using auto-generated notes." > release-notes.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          case "$TAG" in *a*|*b*|*rc*) prerelease_flag="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            $prerelease_flag

  pypi:
    # Disabled by default: the name "knowledge-engine" on PyPI belongs to an unrelated
    # project. Set the repository variable PYPI_PUBLISH=true (and configure a trusted
    # publisher for the chosen distribution name) to enable.
    name: publish to PyPI (trusted publishing)
    if: vars.PYPI_PUBLISH == 'true'
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no stored API token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
