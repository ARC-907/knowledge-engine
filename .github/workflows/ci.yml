name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"
  UV_PROJECT: engine

jobs:
  lint:
    name: lint (ruff, mypy, lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.x"
          python-version: "3.12"
          enable-cache: true
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Install
        run: uv sync --all-groups
      - name: ruff format
        run: uv run ruff format --check --diff .
        working-directory: engine
      - name: ruff check
        run: uv run ruff check --output-format=github .
        working-directory: engine
      - name: mypy
        run: uv run mypy
        working-directory: engine
      - name: registry.json matches the schema
        run: uv run knowledge-engine registry validate ../corpus/registry.json
        working-directory: engine

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows/macOS run as advisory until a runner history exists; Linux is required.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        advisory: [false]
        include:
          - os: windows-latest
            python-version: "3.13"
            advisory: true
          - os: macos-latest
            python-version: "3.13"
            advisory: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.x"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --group test
      - name: pytest
        run: uv run pytest -q -p randomly --cov --cov-report=xml:coverage.xml --cov-report=term
        working-directory: engine
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: engine/coverage.xml
          retention-days: 14

  ui:
    name: dashboard (browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.x"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --group test --group ui
      - name: Install Chromium for the locked Playwright version
        run: uv run playwright install --with-deps chromium
        working-directory: engine
      - name: Browser smoke tests
        working-directory: engine
        env:
          KE_UI_TESTS: "1"
        run: |
          set -euo pipefail
          export KE_UI_ARTIFACT_DIR="$RUNNER_TEMP/ui-artifacts"
          uv run pytest -m ui tests/ui -p no:randomly -rs --junitxml="$RUNNER_TEMP/ui-junit.xml"
      - name: The browser tests ran (none skipped)
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ui-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"browser tests: {tests} collected, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("::error::the dashboard browser tests were skipped or not collected")
          PY
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failure-artifacts
          path: ${{ runner.temp }}/ui-artifacts
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build (sdist, wheel, install smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.x"
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build --out-dir dist
      - name: Check metadata
        run: uv run --group build twine check dist/*
      - name: Wheel ships package data
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q 'knowledge_engine/project_context/migrations/registry/001_' \
            || { echo "::error::wheel is missing project_context/migrations/registry/*.sql"; exit 1; }
          unzip -l "$wheel" | grep -q 'knowledge_engine/project_context/migrations/002_' \
            || { echo "::error::wheel is missing project_context/migrations/*.sql"; exit 1; }
          unzip -l "$wheel" | grep -q 'knowledge_engine/runtime/foundation/db/schema/001_' \
            || { echo "::error::wheel is missing runtime/foundation/db/schema/*.sql"; exit 1; }
          unzip -l "$wheel" | grep -q 'knowledge_engine/core/registry.schema.json' \
            || { echo "::error::wheel is missing core/registry.schema.json"; exit 1; }
          unzip -l "$wheel" | grep -q 'knowledge_engine/py.typed' \
            || { echo "::error::wheel is missing py.typed"; exit 1; }
      - name: Install wheel into a clean environment and smoke-test
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/knowledge-engine --help
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as m
          import knowledge_engine
          from knowledge_engine.server.app import create_app
          assert knowledge_engine.__version__ == m.version("knowledge-engine"), knowledge_engine.__version__
          create_app()
          print("smoke ok", knowledge_engine.__version__)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          retention-days: 14

  workflows:
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read         # check out the workflows
      security-events: write # upload zizmor SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  docs:
    name: docs (paths, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs before the environment is created so no installed package's
      # Markdown ends up in the scan.
      - name: Offline link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --verbose './**/*.md'
          fail: true
          failIfEmpty: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.x"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --no-dev
      - name: Module paths and relative links in the docs resolve
        run: uv run --no-dev python scripts/check_docs_paths.py
      - name: Generated CONFIGURATION.md is current
        run: |
          set -euo pipefail
          uv run --no-dev python -m knowledge_engine.core.settings --markdown > "$RUNNER_TEMP/CONFIGURATION.md"
          diff -u 01-user-docs/CONFIGURATION.md "$RUNNER_TEMP/CONFIGURATION.md" \
            || { echo "::error::01-user-docs/CONFIGURATION.md is stale; regenerate it (see CONTRIBUTING.md)"; exit 1; }
