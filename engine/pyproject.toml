[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowledge-engine"
version = "3.0.0"
description = "Self-hosted, MCP-native knowledge engine: registry, SQLite FTS5 search, FastAPI dashboard, MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "knowledge-engine contributors" }]
keywords = ["mcp", "knowledge-base", "full-text-search", "sqlite", "fts5", "fastapi", "markdown", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "watchdog>=4.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",
    # Imported directly by knowledge_engine.mcp (also pulled in by mcp / fastapi).
    "anyio>=4.0",
    "starlette>=0.40",
]

[project.urls]
Homepage = "https://github.com/ARC-907/knowledge-engine"
Documentation = "https://github.com/ARC-907/knowledge-engine/tree/main/01-user-docs"
Changelog = "https://github.com/ARC-907/knowledge-engine/blob/main/02-dev-docs/CHANGELOG.md"
Issues = "https://github.com/ARC-907/knowledge-engine/issues"
Source = "https://github.com/ARC-907/knowledge-engine"

[project.scripts]
knowledge-engine = "knowledge_engine.cli:main"

# PEP 735 dependency groups (not installed by end users; `uv sync` installs `dev`).
[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "build" },
    "pre-commit>=4.0",
]
lint = [
    "ruff>=0.14",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "pytest-repeat>=0.9.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    # Starlette >=1.0 test client speaks httpx2; without it TestClient warns.
    "httpx2>=2.0",
]
build = [
    "twine>=6.0",
]
# Browser smoke test of the dashboard (engine/tests/ui); opt in with KE_UI_TESTS=1.
ui = [
    "playwright>=1.56",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "src/knowledge_engine",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "N",           # pep8-naming
    "RUF",         # ruff-specific
    "PTH",         # pathlib
    "PLC", "PLE", "PLW",  # pylint convention/error/warning (PLR is too noisy for this codebase)
    "ASYNC",       # async pitfalls
    "S",           # bandit security
    "T20",         # no stray print() in library code
    "C4",          # comprehensions
    "RET",         # return statements
    "PIE",         # misc lints
    "PERF",        # performance anti-patterns
    "LOG", "G",    # logging usage
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "S608",    # SQL built from internal identifier allowlists; reviewed per site
    "RET505", "RET506",  # explicit else after return is a readability choice here
    "PLW2901", # loop variable reassignment is idiomatic in the parsers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the test idiom
    "S105", "S106", "S108",  # fake secrets / tmp paths in fixtures
    "S603", "S607",  # subprocess with fixed argv in tests
    "PLC0415", # local imports keep fixtures isolated from env
    "T20",
]
"src/knowledge_engine/cli/*.py" = ["T20", "PLC0415"]
"src/knowledge_engine/**/cli.py" = ["T20", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_engine"]
combine-as-imports = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/knowledge_engine"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# Substrate packages are typed incrementally (tightened in later train PRs).
[[tool.mypy.overrides]]
module = [
    "knowledge_engine.project_context.*",
    "knowledge_engine.tool_host.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# The board and the runtime substrate: every function is annotated.
[[tool.mypy.overrides]]
module = [
    "knowledge_engine.agent_board.*",
    "knowledge_engine.runtime.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["watchdog.*", "yaml.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib -ra"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error::DeprecationWarning:knowledge_engine.*",
]
markers = [
    "slow: tests that take more than a second",
    "network: tests that need a live Ollama or HTTP endpoint (skipped in CI)",
    "ui: browser (Playwright) smoke tests of the dashboard; run with KE_UI_TESTS=1",
]

[tool.coverage.run]
source = ["knowledge_engine"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured 63.9% at the start of the 3.0 train; ratchet upward as coverage grows.
fail_under = 60
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
]
